apiVersion: route.openshift.io/v1
kind: Route
metadata:
  name: {{ include "pgadmin.name" . }}
  annotations:
    haproxy.router.openshift.io/set-forwarded-headers: replace
spec:
  host: {{ .Values.route.host | quote }}
  to:
    kind: Service
    name: {{ include "pgadmin.name" . }}
  port:
    targetPort: https
  tls:
    termination: reencrypt
    insecureEdgeTerminationPolicy: Redirect
    # Omitted destinationCACertificate uses the standard router's Service CA.
