apiVersion: v1
kind: Service
metadata:
  name: {{ include "pgadmin.name" . }}
  annotations:
    service.beta.openshift.io/serving-cert-secret-name: {{ .Values.tls.servingCertSecretName | quote }}
spec:
  type: ClusterIP
  selector:
    {{- include "pgadmin.selector" . | nindent 4 }}
  ports:
    - name: https
      port: 443
      targetPort: https
